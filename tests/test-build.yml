name: Test - Build step
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        run-config:
          - info: 0
            build: 1
            analyze: 0
            test: 0
            project: 'tests/fixtures/TestApp/TestApp.xcodeproj'
            scheme: 'TestApp'
            configuration: 'Debug'
            destination: 'platform=macOS'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with build enabled
        id: action
        uses: .

      - name: Assert build completed successfully
        run: |
          echo "PASS: build step completed successfully"
