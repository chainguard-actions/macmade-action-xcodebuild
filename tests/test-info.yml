name: Test - Info steps (xcode-select and showsdks)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        run-config:
          - info: 1
            build: 0
            analyze: 0
            test: 0
            project: 'tests/fixtures/TestApp/TestApp.xcodeproj'
            scheme: 'TestApp'
            configuration: ''
            destination: ''
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Xcode is available
        run: |
          xcode-select -p
          echo "Xcode path: $(xcode-select -p)"

      - name: Run action with info enabled
        id: action
        uses: .

      - name: Assert action completed successfully
        run: |
          echo "PASS: info steps completed successfully"
